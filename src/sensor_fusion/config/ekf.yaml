ekf_filter_node:

  ros__parameters:


    # 更新频率

    frequency: 30.0


    # 二维机器人

    two_d_mode: true


    publish_tf: true



    # Frame

    map_frame: map

    odom_frame: odom

    base_link_frame: base_link

    world_frame: odom



    # =========================
    # Encoder Odometry
    # =========================


    odom0: /odom


    odom0_config:

      [
        true,
        true,
        false,

        false,
        false,
        true,

        true,
        true,
        false,

        false,
        false,
        true,

        false,
        false,
        false
      ]

    odom0_differential: false


    # =========================
    # Stereo Visual Odometry
    # =========================


    odom1: /visual_odom


    odom1_config:

      [
        true,
        true,
        false,

        false,
        false,
        true,

        false,
        false,
        false,

        false,
        false,
        false,

        false,
        false,
        false
      ]


    odom1_queue_size: 10


    odom1_differential: false

    odom1_relative: false





    # =========================
    # WT901 IMU
    # =========================


    imu0: /imu/data



    imu0_config:

      [
        false,
        false,
        false,

        false,
        false,
        false,

        false,
        false,
        false,

        false,
        false,
        true,

        false,
        false,
        false
      ]



    imu0_queue_size: 20



    # 使用角速度

    imu0_remove_gravitational_acceleration: true


    imu0_differential: false
